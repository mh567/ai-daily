<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f1ecdf">
  <meta name="description" content="AI 日报每日整理值得关注的模型、产品与产业进展。">
  <meta property="og:title" content="AI 日报 · 每日人工智能新闻">
  <meta property="og:description" content="每日整理值得关注的模型、产品与产业进展。">
  <meta property="og:type" content="website">
  <title>AI 日报 · 每日人工智能新闻</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,650;6..72,750&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/newspaper-prototype.css?v=20260721">
  <script data-goatcounter="https://ai-daily.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
  <a class="skip-link" href="#daily-content">跳至今日新闻</a>

  <header class="paper-header">
    <div class="utility-bar page-shell">
      <a class="utility-link" href="archive.html">历史归档</a>
      <p id="issueLabel">第 001 期</p>
      <a class="utility-link" href="about.html">关于日报</a>
    </div>

    <div class="masthead page-shell">
      <p class="masthead-kicker">ARTIFICIAL INTELLIGENCE DAILY</p>
      <a class="masthead-title" href="index.html" aria-label="AI 日报首页">
        <span>AI</span> 日报
      </a>
      <p class="masthead-note">记录每日值得关注的人工智能进展</p>
    </div>

    <div class="edition-bar">
      <div class="page-shell edition-inner">
        <div class="edition-date">
          <span class="edition-status" aria-hidden="true"></span>
          <span id="displayDate">正在读取今日版</span>
        </div>
        <label class="date-picker">
          <span>切换日期</span>
          <select id="dateSelect" aria-label="切换日报日期" disabled>
            <option>读取中</option>
          </select>
        </label>
      </div>
    </div>
  </header>

  <main id="daily-content" class="page-shell paper-main" tabindex="-1">
    <div id="loadingState" class="loading-state" aria-live="polite">
      <div class="skeleton skeleton-label"></div>
      <div class="skeleton skeleton-title"></div>
      <div class="skeleton skeleton-title short"></div>
      <div class="skeleton skeleton-copy"></div>
      <span class="sr-only">正在排印今日日报</span>
    </div>

    <div id="errorState" class="error-state" hidden>
      <p class="eyebrow">排印提示</p>
      <h1>这一期暂时无法展开</h1>
      <p id="errorMessage">请稍后刷新页面。</p>
      <button id="retryButton" type="button">重新读取</button>
    </div>

    <article id="newspaper" hidden>
      <section id="leadSection" class="lead-layout" aria-labelledby="leadTitle"></section>
      <nav id="sectionNavigation" class="section-navigation" aria-label="本期版面"></nav>
      <div id="newsSections" class="news-sections"></div>
      <section id="briefs" class="brief-section" hidden></section>
      <nav class="edition-footer" aria-label="日报前后期导航">
        <a id="olderEdition" class="edition-jump edition-jump--older" href="#">
          <span>较早一期</span>
          <strong id="olderEditionDate">读取中</strong>
        </a>
        <a id="editionArchive" class="edition-archive" href="archive.html">
          <span>历史归档</span>
          <strong id="archiveCount">全部期数</strong>
        </a>
        <a id="newerEdition" class="edition-jump edition-jump--newer" href="#">
          <span>较新一期</span>
          <strong id="newerEditionDate">读取中</strong>
        </a>
      </nav>
    </article>
  </main>

  <script src="js/newspaper-prototype.js?v=20260721"></script>
</body>
</html>
